name: Deploy Plane Full Stack to dev-ai

on:
  workflow_dispatch: 
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/**'
      - 'docker-compose.yml'

jobs:
  deploy-plane:
    name: Deploy Plane Frontend and Backend
    runs-on: [self-hosted, dev-ai]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment Variables
        run: |
          # Copy .env.example files manually to avoid pnpm errors
          cp .env.example .env
          cp apps/web/.env.example apps/web/.env
          cp apps/api/.env.example apps/api/.env
          cp apps/space/.env.example apps/space/.env
          cp apps/admin/.env.example apps/admin/.env
          cp apps/live/.env.example apps/live/.env
          
          # Replace default URLs with the correct production domain and paths
          DOMAIN="https://vjos.vjstartup.com"
          
          # Fix Web ENV
          cat <<EOF > apps/web/.env
          VITE_API_BASE_URL="${DOMAIN}/api"
          VITE_WEB_BASE_URL="${DOMAIN}"
          VITE_ADMIN_BASE_URL="${DOMAIN}"
          VITE_SPACE_BASE_URL="${DOMAIN}"
          VITE_LIVE_BASE_URL="${DOMAIN}"
          VITE_ENABLE_VJ_STARTUPS=1
          EOF
          
          # Fix Admin ENV
          cp apps/web/.env apps/admin/.env
          # Fix Space ENV
          cp apps/web/.env apps/space/.env

          # Fix Live ENV - this service's .env has a completely different
          # variable shape (API_BASE_URL, REDIS_HOST, etc, not the VITE_*
          # names web/admin/space use), so copying apps/web/.env here like
          # the others was silently wrong from the start: apps/live ended up
          # with only unused VITE_ variables, never a real API_BASE_URL or
          # REDIS_HOST. Found by Pavani - re-applying her fix here after it
          # was lost in an earlier merge (my later PRs kept rewriting this
          # whole file from my own branch history without first pulling her
          # direct pushes to master, so her fix to this exact block got
          # silently overwritten each time).
          cp apps/live/.env.example apps/live/.env
          sed -i "s|API_BASE_URL=.*|API_BASE_URL=\"${DOMAIN}/api\"|g" apps/live/.env
          sed -i "s|WEB_BASE_URL=.*|WEB_BASE_URL=\"${DOMAIN}\"|g" apps/live/.env
          sed -i "s|LIVE_BASE_URL=.*|LIVE_BASE_URL=\"${DOMAIN}\"|g" apps/live/.env
          sed -i "s|REDIS_HOST=.*|REDIS_HOST=plane-redis|g" apps/live/.env
          sed -i "s|REDIS_URL=.*|REDIS_URL=\"redis://plane-redis:6379/\"|g" apps/live/.env

          # SECRET_KEY must be STABLE across deploys - it's used to sign user
          # sessions and to encrypt InstanceConfiguration values (e.g. the
          # Google OAuth client secret, see encrypt_data() in
          # plane/license/utils/encryption.py). Regenerating it on every
          # deploy silently logs every user out and permanently un-decrypts
          # anything already encrypted with the old key. Set a real
          # DJANGO_SECRET_KEY repo/environment secret once; this is only a
          # first-run fallback so the workflow doesn't hard-fail before that
          # secret exists.
          if [ -n "${DJANGO_SECRET_KEY}" ]; then
            SECRET_KEY="${DJANGO_SECRET_KEY}"
          else
            echo "::warning::DJANGO_SECRET_KEY secret is not set - generating a throwaway one. Sessions and encrypted config will break on the next deploy. Set the DJANGO_SECRET_KEY repository secret to fix this permanently."
            SECRET_KEY=$(openssl rand -hex 32)
          fi
          echo "SECRET_KEY=\"${SECRET_KEY}\"" >> apps/api/.env

          # VJ Startups integration - these are never in .env.example (they're
          # per-deployment secrets), so the plain `cp .env.example .env` above
          # leaves them unset unless we add them here explicitly.
          #
          # No silent fallback here: this used to default to
          # "https://vjstartup.com" (the main marketing site's own domain,
          # not the Express API) whenever the VJ_MICROSERVICE_URL repo
          # variable was unset, which would send every admin-proxy request
          # to the wrong host instead of failing loudly.
          if [ -z "${VJ_MICROSERVICE_URL}" ]; then
            echo "::warning::VJ_MICROSERVICE_URL repo variable is not set - the admin proxy to backend 2 (Problems/Ideas verify, user management, startup project provisioning) will not work. Set it to backend 2's own base URL (e.g. https://api.vjstartups.com)."
          fi
          echo "VJ_MICROSERVICE_URL=\"${VJ_MICROSERVICE_URL}\"" >> apps/api/.env
          echo "PUBLIC_SITE_INTERNAL_TOKEN=\"${PUBLIC_SITE_INTERNAL_TOKEN}\"" >> apps/api/.env
          echo "LIVE_SERVER_SECRET_KEY=\"${LIVE_SERVER_SECRET_KEY}\"" >> apps/api/.env
          # apps/live also needs this same value to authenticate with the
          # api service - apps/live/.env was only just created fresh from
          # its own .env.example above (still holding that file's literal
          # "secret-key" placeholder), so without this line the two services
          # would have mismatched secrets and real-time collaboration would
          # silently fail to authenticate.
          sed -i "s|LIVE_SERVER_SECRET_KEY=.*|LIVE_SERVER_SECRET_KEY=\"${LIVE_SERVER_SECRET_KEY}\"|g" apps/live/.env
          if [ -z "${PUBLIC_SITE_INTERNAL_TOKEN}" ]; then
            echo "::warning::PUBLIC_SITE_INTERNAL_TOKEN secret is not set - the admin proxy to backend 2 (Problems/Ideas verify, user management) will not work. It must exactly match PLANE_INTERNAL_TOKEN in backend 2's own deploy secrets."
          fi

          # File storage: this stack runs Plane's own bundled minio container
          # (see docker-compose.yml's plane-minio service and the root
          # .env.example), not external S3 - apps/api/.env.example defaults to
          # USE_MINIO=0 for bare-metal local dev, which is wrong here.
          sed -i 's|USE_MINIO=0|USE_MINIO=1|g' apps/api/.env
          echo 'AWS_S3_ENDPOINT_URL="http://plane-minio:9000"' >> apps/api/.env
          echo 'AWS_ACCESS_KEY_ID="access-key"' >> apps/api/.env
          echo 'AWS_SECRET_ACCESS_KEY="secret-key"' >> apps/api/.env
          echo 'AWS_S3_BUCKET_NAME="uploads"' >> apps/api/.env

          # In USE_MINIO mode, S3Storage builds the browser-facing upload URL
          # from request.scheme (see apps/api/plane/settings/storage.py) -
          # relies on Django correctly detecting HTTPS via
          # SECURE_PROXY_SSL_HEADER. This site sits behind more than one
          # proxy hop (something in front terminates real HTTPS, then
          # forwards to this stack's own Caddy container in plain HTTP -
          # Caddy only listens on :80 here), and X-Forwarded-Proto doesn't
          # survive that chain correctly, so request.scheme resolves to
          # "http" - Django then hands browsers presigned upload URLs on
          # http://, which every browser blocks outright as mixed content on
          # an https:// page. MINIO_ENDPOINT_SSL forces https instead of
          # trusting that detection - this domain is HTTPS-only in practice,
          # so hardcoding it is correct, not a workaround.
          sed -i 's|MINIO_ENDPOINT_SSL=0|MINIO_ENDPOINT_SSL=1|g' apps/api/.env

          # Fix API ENV for CORS and URLs
          sed -i "s|CORS_ALLOWED_ORIGINS=.*|CORS_ALLOWED_ORIGINS=\"${DOMAIN}\"|g" apps/api/.env
          sed -i "s|WEB_URL=.*|WEB_URL=\"${DOMAIN}\"|g" apps/api/.env
          sed -i "s|APP_BASE_URL=.*|APP_BASE_URL=\"${DOMAIN}\"|g" apps/api/.env
          sed -i "s|ADMIN_BASE_URL=.*|ADMIN_BASE_URL=\"${DOMAIN}\"|g" apps/api/.env
          sed -i "s|SPACE_BASE_URL=.*|SPACE_BASE_URL=\"${DOMAIN}\"|g" apps/api/.env
          sed -i "s|LIVE_BASE_URL=.*|LIVE_BASE_URL=\"${DOMAIN}\"|g" apps/api/.env

          # Expose the Plane Proxy on port 8888 (since port 80 is heavily used)
                    sed -i 's/LISTEN_HTTP_PORT=80/LISTEN_HTTP_PORT=8888/g' .env
          sed -i 's/LISTEN_HTTPS_PORT=443/LISTEN_HTTPS_PORT=8443/g' .env

          # Optional service passwords. The defaults in .env.example ("plane" for Postgres and
          # RabbitMQ, "access-key"/"secret-key" for MinIO) are published in a public repository.
          # Set the repository secrets POSTGRES_PASSWORD, RABBITMQ_PASSWORD, S3_ACCESS_KEY and
          # S3_SECRET_KEY to replace them. Nothing changes while they are unset. Values are
          # limited to URL-safe characters because the database password is embedded unencoded
          # in DATABASE_URL and every value goes through sed.
          apply_secret() { # apply_secret VARIABLE_NAME VALUE FILE...
            local name="$1" value="$2"
            shift 2
            [ -n "$value" ] || return 0
            if ! printf '%s' "$value" | grep -Eq '^[A-Za-z0-9._~-]{16,}$'; then
              echo "::error::The secret for $name must be at least 16 characters, using only letters, digits, '.', '_', '~' and '-'."
              exit 1
            fi
            for file in "$@"; do
              sed -i "s|^${name}=.*|${name}=\"${value}\"|" "$file"
            done
          }
          apply_secret POSTGRES_PASSWORD "$SVC_POSTGRES_PASSWORD" .env apps/api/.env
          apply_secret RABBITMQ_PASSWORD "$SVC_RABBITMQ_PASSWORD" .env apps/api/.env
          apply_secret AWS_ACCESS_KEY_ID "$SVC_S3_ACCESS_KEY" .env apps/api/.env
          apply_secret AWS_SECRET_ACCESS_KEY "$SVC_S3_SECRET_KEY" .env apps/api/.env
        env:
          SVC_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SVC_RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          SVC_S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          SVC_S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          VJ_MICROSERVICE_URL: ${{ vars.VJ_MICROSERVICE_URL }}
          PUBLIC_SITE_INTERNAL_TOKEN: ${{ secrets.PUBLIC_SITE_INTERNAL_TOKEN }}
          LIVE_SERVER_SECRET_KEY: ${{ secrets.LIVE_SERVER_SECRET_KEY }}

      - name: Expose Database Port (Override)
        run: |
          # Keep port 5434 exposed for the other vjstartup application
          cat <<EOF > docker-compose.override.yml
          services:
            plane-db:
              ports:
                - "5434:5432"
          EOF
          
      - name: Start Full Plane Stack
        run: |
          # The --build flag ensures the frontend and backend images are compiled locally on the server
          docker compose up -d --build
          
      - name: Wait for Stack Initialization
        run: |
          echo "Waiting for PostgreSQL and API to accept connections..."
          sleep 15
          
      - name: Run Django Migrations
        run: |
          docker compose run --rm api python manage.py migrate
          
      - name: Seed VJ Startups reference data (wings, badges)
        run: |
          # Reference data only, idempotent, never overwrites existing rows.
          # DO NOT add --with-demo-data here: it creates fake accounts (one a
          # superuser) and is refused unless DEBUG is on. It used to run on every
          # deploy and reset those accounts to a shared password - see
          # lock_demo_accounts for cleaning up instances that already have them.
          docker compose run --rm api python manage.py seed_vj_startups

      - name: Backfill Cycles/Modules/Views on existing projects
        run: |
          # No-ops cleanly if every project already has these flags set - see
          # apps/api/plane/vj_startups/management/commands/backfill_project_features.py
          docker compose run --rm api python manage.py backfill_project_features

      - name: Backfill default states on existing projects
        run: |
          # No-ops cleanly if every project already has states - see
          # apps/api/plane/vj_startups/management/commands/backfill_project_states.py
          docker compose run --rm api python manage.py backfill_project_states

      - name: Backfill default labels on existing projects
        run: |
          # No-ops cleanly if every project already has labels - see
          # apps/api/plane/vj_startups/management/commands/backfill_project_labels.py
          docker compose run --rm api python manage.py backfill_project_labels

      - name: Backfill ProjectIdentifier rows on existing projects
        run: |
          # No-ops cleanly if every project already has a ProjectIdentifier - see
          # apps/api/plane/vj_startups/management/commands/backfill_project_identifiers.py
          docker compose run --rm api python manage.py backfill_project_identifiers
