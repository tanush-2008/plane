name: Run API tests (fork only)

# Runs the Django test suite against a real Postgres via docker-compose-test.yml, plus the
# migration check, on GitHub's runners. For use on a fork; triggered by a push to
# ci/run-api-tests or by hand. Not meant for the upstream repository.

on:
  workflow_dispatch:
  push:
    branches:
      - ci/run-api-tests

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Create the API env file
        run: cp apps/api/.env.example apps/api/.env

      # MinIO's public images are gone (Docker Hub and quay.io both refuse the pull), and these tests do
      # not use object storage, so run the stack without it.
      - name: Run the test stack without MinIO
        run: |
          yq -i 'del(.services.test-minio) | del(.services.api-tests.depends_on.test-minio)' docker-compose-test.yml
          grep -n 'minio' docker-compose-test.yml || echo 'no minio left in the compose file'

      - name: Migrations are in sync with the models, and apply cleanly
        run: |
          docker compose -f docker-compose-test.yml run --rm --build api-tests \
            sh -c "python manage.py makemigrations --check --dry-run && python manage.py migrate --noinput && echo MIGRATE_OK"

      - name: VJ Startups unit tests
        if: always()
        run: |
          docker compose -f docker-compose-test.yml run --rm api-tests \
            pytest plane/tests/unit/vj_startups -q -p no:cacheprovider

      - name: All unit tests
        if: always()
        run: |
          docker compose -f docker-compose-test.yml run --rm api-tests \
            pytest -m unit -q -p no:cacheprovider

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose-test.yml down -v
